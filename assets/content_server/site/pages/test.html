<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Tree Viewer</title>
    <style>
        .file-tree-container {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
            border-radius: 5px;
            display: inline-block;
        }
        .file-tree-container * {
            all: unset; /* Prevent interference from outer styles */
            display: revert;
        }
        .file-tree-container h2 {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        .file-tree ul { 
            list-style-type: none; 
            padding-left: 15px; 
            margin: 0;
        }
        .file-tree .folder { 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            font-size: 1.2em; 
            padding: 5px;
        }
        .file-tree .hidden { 
            display: none; 
        }
        .file-tree .toggle::before { 
            content: "▶"; 
            display: inline-block; 
            margin-right: 8px; 
            font-size: 1em; 
            transition: transform 0.2s ease;
        }
        .file-tree .expanded::before { 
            content: "▼"; 
            transform: rotate(90deg); 
        }
        .file-tree li { 
            padding: 5px 0; 
            font-size: 1.1em; 
            background: white;
            margin: 2px 0;
            padding: 5px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .file-tree li:hover {
            background: #e0e0e0;
        }
        .file-tree a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .file-tree a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="file-tree-container">
        <h2>File Tree</h2>
        <div id="fileTree" class="file-tree"></div>
    </div>
    
    <script>
        const filePaths = [
            "src/index.js",
            "src/components/Button.js",
            "src/components/Header.js",
            "src/utils/helpers.js",
            "assets/images/logo.png",
            "assets/styles/main.css"
        ];

        function buildTree(paths) {
            let tree = {};
            
            paths.forEach(path => {
                let parts = path.split('/');
                let current = tree;
                
                parts.forEach((part, index) => {
                    if (!current[part]) {
                        current[part] = index === parts.length - 1 ? path : {};
                    }
                    current = current[part];
                });
            });
            return tree;
        }

        function renderTree(node, parentElement, isRoot = false) {
            let ul = document.createElement('ul');
            if (!isRoot) ul.classList.add('hidden');
            parentElement.appendChild(ul);
            
            let entries = Object.keys(node);
            entries.sort((a, b) => {
                let isAFolder = typeof node[a] === 'object';
                let isBFolder = typeof node[b] === 'object';
                return isAFolder === isBFolder ? a.localeCompare(b) : isBFolder - isAFolder;
            });
            
            entries.forEach(key => {
                let li = document.createElement('li');
                ul.appendChild(li);
                
                if (typeof node[key] === 'object') {
                    let span = document.createElement('span');
                    span.textContent = key;
                    span.classList.add('folder', 'toggle');
                    span.onclick = () => {
                        let childUl = span.nextElementSibling;
                        childUl.classList.toggle('hidden');
                        span.classList.toggle('expanded');
                    };
                    li.appendChild(span);
                    renderTree(node[key], li);
                } else {
                    let a = document.createElement('a');
                    a.textContent = key;
                    a.href = node[key];
                    a.target = "_blank";
                    li.appendChild(a);
                }
            });
        }
        
        let tree = buildTree(filePaths);
        renderTree(tree, document.getElementById('fileTree'), true);
    </script>
</body>
</html>
